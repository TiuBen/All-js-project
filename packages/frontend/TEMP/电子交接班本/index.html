<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0" />
    <title>电子交接班本UI</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- 引入 Heroicons 图标库 -->
    <script src="https://cdn.jsdelivr.net/npm/heroicons@latest/outline.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/heroicons@latest/solid.js"></script>
</head>

<body>

    <div class="flex flex-col gap-2 p-3 ">

        <div class="flex flex-row justify-between border   rounded p-2">
            <div> 东场务 03-20 作业 </div>

            <svg xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-6">
                <path stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M12 18.75a6 6 0 0 0 6-6v-1.5m-6 7.5a6 6 0 0 1-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 0 1-3-3V4.5a3 3 0 1 1 6 0v8.25a3 3 0 0 1-3 3Z" />
            </svg>
        </div>
        <!-- 使用 Heroicons 中的 CheckCircle 图标 -->
        <div class="flex flex-row justify-between items-center border   rounded p-2">
            <div class=" text-gray-600 text-2xl"> <!-- 添加左边距，使任务描述与状态分离 -->
                西场务 03-01 作业
                <div class="text-sm text-gray-400">
                    结束时间 北京时间03月01日 09:00:00
                </div>
            </div>
            <img class="max-w-[12%] max-h-[5rem]"
                alt="缩略图"
                src="https://picsum.photos/600/400">
            <svg xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-6">
                <path stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M12 18.75a6 6 0 0 0 6-6v-1.5m-6 7.5a6 6 0 0 1-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 0 1-3-3V4.5a3 3 0 1 1 6 0v8.25a3 3 0 0 1-3 3Z" />
            </svg>

        </div>
    </div>
    </div>

</body>

</html>
