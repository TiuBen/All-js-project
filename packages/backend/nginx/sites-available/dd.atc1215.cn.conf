# ============================================================
# dd.atc1215.cn —— 航班调度系统（前端 + 同源反代后端 /api）
# ------------------------------------------------------------
# 拓扑：浏览器 → nginx(dd.atc1215.cn) ─┬─ /        静态前端 dist/
#                                      └─ /api/    127.0.0.1:5183 (V5-dispatch)
# 前端 .env.production 用 VITE_API_BASE=/api，同源、无跨域，无需开 CORS。
#
# 部署位置：/etc/nginx/sites-available/dd.atc1215.cn.conf
# 启用：    sudo ln -s /etc/nginx/sites-available/dd.atc1215.cn.conf /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# ============================================================

server {
    listen 80;
    server_name dd.atc1215.cn;

    # 证书就绪后打开这一行，强制走 https（否则 iPad 端访问会混用）
    # return 301 https://$host$request_uri;

    root /var/www/dd.atc1215.cn/dist;
    index index.html;

    # ★ 上传检查项截图最大 8MB，nginx 默认只放 1m，不改这里上传必报 413
    client_max_body_size 20m;

    # 前端单页应用：找不到实体文件一律回 index.html，交给 react-router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ★ 静态资源长缓存（文件名带 hash，内容变了文件名就变）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ★ 后端 API 反代（含 /api/checklists/uploads 上传与 /api/uploads/*.png 取图）
    #   proxy_pass 不带尾斜杠 → 原样透传 /api/... 前缀，后端路由正是挂在 /api 下
    location /api/ {
        proxy_pass http://127.0.0.1:5183;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上传 8MB 图片 + 提交 10MB 的 JSON（检查单 items），超时放宽
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_request_buffering off;   # 大文件边收边转，避免占满临时目录

        # 不缓存接口响应
        add_header Cache-Control "no-store";
    }
}

