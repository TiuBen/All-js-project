# ============================================================
# api.duty.atc1215.cn —— 独立 API 子域（后端单独暴露时用）
# ------------------------------------------------------------
# ⚠️ 二选一，不要和 dd.atc1215.cn.conf 的 /api/ 反代同时用：
#    · 方案 A（推荐，省事）：前端与 API 同域，用 dd.atc1215.cn.conf，
#      前端 VITE_API_BASE=/api，浏览器同源 → 不触发跨域，本文件不用启用。
#    · 方案 B（本文件）：API 单独一个子域，前端在别的域名，
#      此时浏览器会跨域 → 后端 .env 必须配 CORS_ORIGIN=https://前端域名
#
# 部署位置：/etc/nginx/sites-available/api.duty.atc1215.cn.conf
# ============================================================

server {
    listen 80;
    server_name api.duty.atc1215.cn;

    # 证书就绪后打开
    # return 301 https://$host$request_uri;

    # ★ 默认 1m 会让 8MB 的检查项截图上传直接 413
    client_max_body_size 20m;

    # 后端所有路由本来就挂在 /api 前缀下，这里原样透传
    location /api/ {
        proxy_pass http://127.0.0.1:5183;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_request_buffering off;

        # 跨域场景下由 nginx 统一加 CORS 头（也可交给后端 cors 中间件，
        # 二者只留一个，避免出现重复的 Access-Control-Allow-Origin）
        # add_header Access-Control-Allow-Origin  https://你的前端域名 always;
        # add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
        # add_header Access-Control-Allow-Headers "Content-Type" always;
        # add_header Access-Control-Allow-Credentials "true" always;
        # if ($request_method = OPTIONS) { return 204; }
    }

    # 根路径给个提示，避免误访问时看到 nginx 默认页
    location = / {
        default_type application/json;
        return 200 '{"service":"v5-dispatch","hint":"API 根路径为 /api，健康检查 /api/health"}';
    }
}

